name: Fetch Working Proxies

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "utils/fetchProxies.py"
      - ".github/workflows/fetch-proxies.yml"

permissions:
  contents: write

concurrency:
  group: fetch-proxies
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # ── Critical for live logging ─────────────────────────────────────────
    # PYTHONUNBUFFERED makes Python flush after every print(), so each
    # line appears in the Actions log immediately instead of at the end.
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      PROXY_LOG_LEVEL: "INFO"        # change to DEBUG for per-endpoint detail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scraper exists
        run: |
          test -f utils/fetchProxies.py || (echo "utils/fetchProxies.py not found" && exit 1)

      - name: Run proxy scraper & tester (live logs below)
        id: scrape
        run: python -u utils/fetchProxies.py
        continue-on-error: true

      - name: Show results summary
        if: always()
        run: |
          if [ -f utils/working_proxies.json ]; then
            python - <<'PY'
            import json
            d = json.load(open("utils/working_proxies.json"))
            print(f"total_working = {d.get('total_working', 0)}")
            print(f"total_tested  = {d.get('total_tested', 0)}")
            print(f"generated_at  = {d.get('generated_at', '')}")
            for p in d.get("proxies", [])[:10]:
                print(f"  {p['proxy']:<22} {p['type']:<7} "
                      f"{p['works_with']:<13} {p['avg_ms']}ms")
            if len(d.get("proxies", [])) > 10:
                print(f"  ... and {len(d['proxies']) - 10} more")
            PY
          else
            echo "No output file produced."
          fi

      - name: Upload results as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-proxies-${{ github.run_number }}
          path: utils/working_proxies.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated working_proxies.json
        if: always()
        run: |
          git config user.name  "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"

          if [ ! -f utils/working_proxies.json ]; then
            echo "No output file — nothing to commit."
            exit 0
          fi

          git add utils/working_proxies.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update working proxies [skip ci] ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

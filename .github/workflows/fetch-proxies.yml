name: Fetch Working Proxies

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "utils/fetchProxies.py"
      - ".github/workflows/fetch-proxies.yml"

permissions:
  contents: write

concurrency:
  group: fetch-proxies
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      PROXY_LOG_LEVEL: "INFO"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scraper exists
        run: |
          test -f utils/fetchProxies.py || (echo "utils/fetchProxies.py not found" && exit 1)

      - name: Run proxy scraper & tester (live logs below)
        id: scrape
        run: python -u utils/fetchProxies.py
        continue-on-error: true

      - name: Show results summary
        if: always()
        run: |
          if [ ! -f utils/working_proxies.json ]; then
            echo "No output file produced."
            exit 0
          fi
          echo "─── working_proxies.json ───"
          jq -r '"total_working = \(.total_working)"' utils/working_proxies.json
          jq -r '"total_tested  = \(.total_tested)"'  utils/working_proxies.json
          jq -r '"generated_at  = \(.generated_at)"'  utils/working_proxies.json
          echo ""
          echo "Top 10 fastest:"
          jq -r '.proxies[:10][] | "  \(.proxy)  \(.type)  \(.works_with)  \(.avg_ms)ms"' utils/working_proxies.json || true
          TOTAL=$(jq '.proxies | length' utils/working_proxies.json)
          if [ "$TOTAL" -gt 10 ]; then
            echo "  ... and $((TOTAL - 10)) more"
          fi

      - name: Upload results as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-proxies-${{ github.run_number }}
          path: utils/working_proxies.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated working_proxies.json
        if: always()
        run: |
          git config user.name  "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          if [ ! -f utils/working_proxies.json ]; then
            echo "No output file — nothing to commit."
            exit 0
          fi
          git add utils/working_proxies.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update working proxies [skip ci] ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
